name: Publish to GitHub Pages

# GitHub Pages serves the gh-pages branch. This mirrors main into it on every push,
# so main stays the only branch anyone edits. Pages then builds automatically and
# picks up the custom domain from the CNAME file.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to gh-pages
        run: git push --force origin HEAD:gh-pages
