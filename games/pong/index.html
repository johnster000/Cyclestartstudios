<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pong · Cycle Start Studios</title>
  <link rel="icon" type="image/png" href="../../assets/logo.png">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2;
      font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
    nav { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; box-sizing: border-box; }
    nav a { color: #7ac943; text-decoration: none; font-size: 0.9rem; }
    canvas { background: #0e0e0e; border: 1px solid #222; border-radius: 8px; max-width: 100%; touch-action: none; }
    p { color: #9a9a9a; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav><a href="../../">&larr; Cycle Start Studios</a><span>Pong</span></nav>
  <canvas id="c" width="800" height="450"></canvas>
  <p>Move the mouse or drag on the screen to control the left paddle. Press Space or tap to start. First to 5 wins.</p>
  <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    const W = c.width, H = c.height, PW = 12, PH = 80, R = 8;
    let player = { y: H/2 - PH/2, score: 0 }, cpu = { y: H/2 - PH/2, score: 0 };
    let ball = {}, running = false, over = false;

    function reset(dir) {
      ball = { x: W/2, y: H/2, vx: 5 * dir, vy: (Math.random() * 4 - 2) };
    }
    reset(1);

    function pointer(e) {
      const r = c.getBoundingClientRect();
      const y = ((e.touches ? e.touches[0].clientY : e.clientY) - r.top) * (H / r.height);
      player.y = Math.max(0, Math.min(H - PH, y - PH/2));
    }
    c.addEventListener('mousemove', pointer);
    c.addEventListener('touchmove', e => { e.preventDefault(); pointer(e); }, { passive: false });
    function start() {
      if (over) { player.score = cpu.score = 0; over = false; reset(1); }
      running = true;
    }
    c.addEventListener('click', start);
    c.addEventListener('touchstart', start);
    window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); start(); } });

    function update() {
      if (!running) return;
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.y < R || ball.y > H - R) ball.vy *= -1;

      // CPU tracks the ball with a little lag
      const target = ball.y - PH/2;
      cpu.y += Math.sign(target - cpu.y) * Math.min(4, Math.abs(target - cpu.y));

      // paddles
      if (ball.x - R < 20 + PW && ball.y > player.y && ball.y < player.y + PH && ball.vx < 0) {
        ball.vx = -ball.vx * 1.05; ball.vy += ((ball.y - (player.y + PH/2)) / PH) * 6;
      }
      if (ball.x + R > W - 20 - PW && ball.y > cpu.y && ball.y < cpu.y + PH && ball.vx > 0) {
        ball.vx = -ball.vx * 1.05; ball.vy += ((ball.y - (cpu.y + PH/2)) / PH) * 6;
      }

      if (ball.x < 0) { cpu.score++; running = false; reset(-1); }
      if (ball.x > W) { player.score++; running = false; reset(1); }
      if (player.score >= 5 || cpu.score >= 5) { over = true; running = false; }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = '#333'; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#f2f2f2';
      ctx.fillRect(20, player.y, PW, PH);
      ctx.fillRect(W - 20 - PW, cpu.y, PW, PH);
      ctx.fillStyle = '#7ac943';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f2f2f2'; ctx.font = '700 40px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(player.score, W/2 - 60, 50); ctx.fillText(cpu.score, W/2 + 60, 50);
      if (!running) {
        ctx.font = '600 22px system-ui, sans-serif'; ctx.fillStyle = '#7ac943';
        ctx.fillText(over ? (player.score > cpu.score ? 'You win! Tap to play again' : 'CPU wins. Tap to play again')
                          : 'Tap or press Space to start', W/2, H/2 + 60);
      }
    }
    (function loop() { update(); draw(); requestAnimationFrame(loop); })();
  </script>
</body>
</html>
