<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cycle Start Studios</title>
  <meta name="description" content="Games and learning apps by Cycle Start Studios. Play and learn free in your browser.">
  <link rel="icon" href="favicon.ico" sizes="64x64">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <meta property="og:title" content="Cycle Start Studios">
  <meta property="og:description" content="Games and learning apps by Cycle Start Studios. Play and learn free in your browser.">
  <meta property="og:image" content="https://cyclestartstudios.com/assets/logo.png">
  <style>
    :root {
      --bg: #000;
      --panel: #0e0e0e;
      --border: #222;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --accent: #7ac943;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: inherit; text-decoration: none; }
    header { text-align: center; padding: 3rem 1rem 1rem; }
    header img { width: min(320px, 70vw); height: auto; display: block; margin: 0 auto; }
    header p { color: var(--muted); margin: 0.5rem 0 0; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.85rem; }
    /* Social links. Inline SVG rather than an icon font: the site ships no
       dependencies, and these have to work offline like everything else.
       White by default, logo-green on hover, matching the mark. */
    .social { display: flex; gap: 0.75rem; justify-content: center; margin-top: 1.1rem; }
    .social a { display: grid; place-items: center; width: 44px; height: 44px;
      border-radius: 12px; border: 1px solid var(--border); color: var(--text);
      transition: color .15s ease, border-color .15s ease, transform .15s ease; }
    .social a:hover, .social a:focus-visible {
      color: var(--accent); border-color: var(--accent); transform: translateY(-2px); }
    .social a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .social svg { width: 22px; height: 22px; display: block; }
    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    /* Category tabs (Games, Learning). Same type as the old section headings. */
    .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--border); }
    .tab { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 0.55rem;
      padding: 0.75rem 1.1rem; margin-bottom: -1px; border-bottom: 2px solid transparent;
      font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.95rem;
      color: var(--muted); transition: color .15s ease, border-color .15s ease; }
    .tab[hidden] { display: none; }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px 8px 0 0; }
    .tab .count { font-size: 0.72rem; letter-spacing: 0; line-height: 1; padding: 0.2rem 0.45rem;
      border: 1px solid var(--border); border-radius: 999px; color: var(--muted); }
    .tab[aria-selected="true"] .count { border-color: var(--accent); color: var(--accent); }
    @media (max-width: 520px) { .tab { flex: 1; justify-content: center; padding: 0.75rem 0.5rem; } }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem; margin-top: 1.5rem; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column; transition: transform .15s ease, border-color .15s ease; }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #111; display: block; }
    .card .body { padding: 1rem; display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
    .card h3 { margin: 0; font-size: 1.1rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.92rem; line-height: 1.4; flex: 1; }
    .card .controls { font-size: 0.8rem; color: var(--accent); }
    .card .play { margin-top: 0.6rem; align-self: flex-start; background: var(--accent); color: #000;
      font-weight: 700; padding: 0.45rem 1rem; border-radius: 999px; font-size: 0.85rem; }
    .lede { color: var(--muted); margin: 1.1rem 0 0; font-size: 0.95rem; }
    .empty { color: var(--muted); text-align: center; padding: 3rem 1rem; border: 1px dashed var(--border); border-radius: 12px; }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 2rem 1rem; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <img src="assets/logo.png" alt="Cycle Start Studios">
    <p>Play and learn free in your browser</p>
    <nav class="social" aria-label="Cycle Start Studios on social media">
      <a href="https://www.facebook.com/cyclestartstudios" target="_blank" rel="noopener"
         aria-label="Cycle Start Studios on Facebook" title="Facebook">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M14.9 8.6h-1.3c-.5 0-.8.3-.8.9v1.4h2.1l-.3 2.1h-1.8v4.7h-2.2v-4.7H8.9v-2.1h1.7V9.3
                   c0-1.7 1-2.8 2.7-2.8h1.6z" fill="currentColor"/>
        </svg>
      </a>
      <a href="https://www.instagram.com/cyclestartstudios" target="_blank" rel="noopener"
         aria-label="Cycle Start Studios on Instagram" title="Instagram">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="12" cy="12" r="4.1" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="17.1" cy="6.9" r="1.15" fill="currentColor"/>
        </svg>
      </a>
    </nav>
  </header>

  <main>
    <!-- One tab per category. A tab appears once games.json has an entry for it;
         #learning in the URL opens that tab directly. -->
    <div class="tabs" role="tablist" aria-label="Categories">
      <button class="tab" type="button" role="tab" id="tab-games" data-section="games"
              aria-controls="panel-games" aria-selected="true">Games <span class="count" hidden></span></button>
      <button class="tab" type="button" role="tab" id="tab-learning" data-section="learning"
              aria-controls="panel-learning" aria-selected="false" tabindex="-1" hidden>Learning <span class="count" hidden></span></button>
    </div>
    <div role="tabpanel" id="panel-games" aria-labelledby="tab-games">
      <div id="games" class="grid" aria-live="polite"></div>
    </div>
    <div role="tabpanel" id="panel-learning" aria-labelledby="tab-learning" hidden>
      <p class="lede">Practice for school, made to feel like a game. Free, with no ads and no accounts.</p>
      <div id="learning" class="grid" aria-live="polite"></div>
    </div>
  </main>

  <footer>&copy; <span id="year"></span> Cycle Start Studios</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Each games.json entry is a game unless it says "section": "learning".
    // Learning apps live under learn/<slug>/, games under games/<slug>/.
    const SECTIONS = {
      games:    { grid: 'games',    folder: 'games/', button: 'Play' },
      learning: { grid: 'learning', folder: 'learn/', button: 'Start' },
    };

    // ---- Tabs ----------------------------------------------------------
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const shown = () => tabs.filter((t) => !t.hidden);

    function selectTab(name, { focus = false, updateUrl = true } = {}) {
      for (const t of tabs) {
        const on = t.dataset.section === name;
        t.setAttribute('aria-selected', String(on));
        t.tabIndex = on ? 0 : -1;
        document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
        if (on && focus) t.focus();
      }
      // Games is the home view, so it keeps a clean URL; other tabs get a #hash
      // that can be shared or bookmarked.
      if (updateUrl) history.replaceState(null, '', name === 'games' ? location.pathname + location.search : '#' + name);
    }

    function tabFromUrl() {
      const want = location.hash.slice(1);
      return shown().some((t) => t.dataset.section === want) ? want : 'games';
    }

    for (const t of tabs) {
      t.addEventListener('click', () => selectTab(t.dataset.section));
      t.addEventListener('keydown', (e) => {
        const list = shown();
        const i = list.indexOf(t);
        const next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: list.length - 1 }[e.key];
        if (next === undefined) return;
        e.preventDefault();
        selectTab(list[(next + list.length) % list.length].dataset.section, { focus: true });
      });
    }
    addEventListener('hashchange', () => selectTab(tabFromUrl(), { updateUrl: false }));

    function setCount(name, n) {
      const c = document.querySelector(`#tab-${name} .count`);
      c.textContent = n;
      c.hidden = !n;
    }

    function card(g, section) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = section.folder + g.slug + '/';
      a.innerHTML = `
        <img src="${g.thumbnail || 'assets/logo.png'}" alt="" loading="lazy">
        <div class="body">
          <h3></h3>
          <p></p>
          <span class="controls"></span>
          <span class="play"></span>
        </div>`;
      a.querySelector('h3').textContent = g.title;
      a.querySelector('p').textContent = g.description || '';
      a.querySelector('.controls').textContent = g.controls || '';
      a.querySelector('.play').textContent = section.button;
      return a;
    }

    fetch('games.json', { cache: 'no-cache' })
      .then(r => r.json())
      .then(entries => {
        const games = entries.filter(g => g.section !== 'learning');
        const learning = entries.filter(g => g.section === 'learning');

        const grid = document.getElementById('games');
        if (!games.length) grid.outerHTML = '<div class="empty">No games yet. Check back soon.</div>';
        for (const g of games) grid.appendChild(card(g, SECTIONS.games));
        setCount('games', games.length);

        if (learning.length) {
          document.getElementById('tab-learning').hidden = false;
          const lgrid = document.getElementById('learning');
          for (const g of learning) lgrid.appendChild(card(g, SECTIONS.learning));
          setCount('learning', learning.length);
        }
        selectTab(tabFromUrl(), { updateUrl: false });
      })
      .catch(() => {
        document.getElementById('games').outerHTML =
          '<div class="empty">Could not load the game list.</div>';
      });
  </script>
  <!-- Visitor counting: GoatCounter. No cookies, no personal data, no consent banner.
       Counts page views only; it skips localhost automatically. -->
  <script data-goatcounter="https://cyclestartstudios.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
